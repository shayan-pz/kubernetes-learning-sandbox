apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      containers:
      - name: node-agent
        image: busybox
        command:
          - sh
          - -c
          - |
            while true; do
              echo "Monitoring node..."
              sleep 30
            done